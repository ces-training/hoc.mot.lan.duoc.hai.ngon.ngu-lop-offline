<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Vào học · Anh – Trung – Kids</title>
<style>
  :root{--bg:#FFF6E0;--ink:#3A2E1A;--brand:#E3262E;--muted:#7A6A55}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:"Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;box-sizing:border-box}
  .box{max-width:380px;width:100%;background:#fff;border:4px solid #F5C04A;border-radius:24px;padding:24px 20px;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.12)}
  h1{font-size:22px;margin:8px 0;color:var(--brand)}p{line-height:1.5;margin:8px 0}.muted{color:var(--muted);font-size:14px}
  .sp{width:46px;height:46px;border:5px solid #F5C04A;border-top-color:var(--brand);border-radius:50%;margin:8px auto;animation:q 1s linear infinite}@keyframes q{to{transform:rotate(360deg)}}
  a{color:var(--brand);font-weight:700}
</style>
</head>
<body>
<!-- Link riêng của từng con: .../con/?k=MÃ. Trang hỏi máy chủ con đang học khoá nào rồi mở đúng web (Little Seed / Seedling).
     Sau khi cô chuyển con lên khoá mới, link cũ vẫn dùng được. Máy chủ: apps-script/lop-offline-48/Code.gs (lệnh con_link, bản 10). -->
<div class="box" id="box"><div class="sp" aria-hidden="true"></div><h1>Đang mở bài học của con…</h1><p class="muted">Chờ một chút nhé.</p></div>
<script>
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbxA0_S8xQRc9IpzVcQ06-waH5OT7H5crqr-yFTwmKUij09zf9qPbzRsiX-iCPHnnocz/exec';
  var WEB = { ls: '../little-seed/', sd: '../seedling/' };
  var m = location.search.match(/[?&]k=([a-z0-9]{8,20})/i), k = m ? m[1].toLowerCase() : '';
  var box = document.getElementById('box');
  function loi(t) { box.innerHTML = '<h1>Chưa mở được 😿</h1><p>' + t + '</p><p class="muted">Ba mẹ cần hỗ trợ: <a href="tel:0974840845">Hotline CES 0974.840.845</a></p>'; }
  if (!k) return loi('Link chưa đầy đủ. Ba mẹ mở lại đúng link cô gửi (có đoạn <b>?k=</b> ở cuối) nhé.');
  var nho = null; try { nho = JSON.parse(localStorage.getItem('con-lop@' + k) || 'null'); } catch (e) {}
  function di(lop) { try { localStorage.setItem('con-lop@' + k, JSON.stringify(lop)); } catch (e) {} location.replace(WEB[lop] + '?k=' + k + location.hash); }
  var xong = false;
  fetch(API + '?action=con_link&k=' + encodeURIComponent(k), { redirect: 'follow' }).then(function (r) { return r.json(); }).then(function (r) {
    xong = true; if (r && r.ok && WEB[r.lop]) return di(r.lop);
    loi((r && r.err) || 'Link này không còn dùng được. Ba mẹ xin cô link mới nhé.');
  }).catch(function () { xong = true; if (nho && WEB[nho]) return di(nho); loi('Chưa nối được mạng. Ba mẹ kiểm tra mạng rồi mở lại link nhé.'); });
  setTimeout(function () { if (!xong && nho && WEB[nho]) di(nho); }, 8000);   // mạng chậm: mở theo lần trước, web sẽ tự kiểm tra lại
})();
</script>
</body>
</html>
